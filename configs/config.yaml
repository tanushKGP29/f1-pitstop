# Global Configuration for F1 Pit Stop Prediction

paths:
  train_data: "Datasets/train.csv"
  test_data: "Datasets/test.csv"
  models_dir: "models"
  cache_path: "Datasets/train_preprocessed_cache.pkl"

target_encoding:
  smoothing:
    Driver: 10
    Race: 10
    Race_Compound: 15

models:
  ensemble:
    n_splits: 5
    blend_weights:
      lgb: 0.35
      cb: 0.35
      xgb: 0.30

  lightgbm:
    num_leaves: 81
    max_depth: 10
    learning_rate: 0.05
    subsample: 0.7
    colsample_bytree: 0.5
    min_child_samples: 44
    scale_pos_weight: 2.5
    n_estimators: 800
    boosting_type: "gbdt"
    random_state: 42

  catboost:
    iterations: 800
    learning_rate: 0.05
    depth: 8
    l2_leaf_reg: 3.0
    random_seed: 42
    auto_class_weights: "Balanced"

  xgboost:
    n_estimators: 800
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.7
    colsample_bytree: 0.5
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: 2.5
    boosting_type: "gbdt"
    random_state: 42
